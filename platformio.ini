; PlatformIO Project Configuration File
; ESP32 File Manager with WiFi Manager and OTA Updates

[env:heltec-v2]
platform = espressif32
board = esp32dev
framework = arduino

; Pre-build script: compress web files
extra_scripts = pre:scripts/compress_web_files.py

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -fpermissive
    -Wno-deprecated-declarations
    ; Async TCP/WebServer optimizations
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    ; Increase web server buffer for large files
    -DWEBSERVER_MAX_CONTENT_SIZE=8192
    ; Increase MQTT buffer for large JSON payloads (increased from 2048 to 4096)
    -DMQTT_MAX_PACKET_SIZE=4096
    ; Compiler optimizations for performance
    -O2
    -ffast-math
    ; I2C Pins (Standard ESP32)
    -DPIN_I2C_SDA=4
    -DPIN_I2C_SCL=15

; Library dependencies
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/dvarrel/AsyncTCP
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10
    arduino-libraries/NTPClient@^3.2.1

; Upload settings
upload_speed = 921600

; Partition scheme for OTA support with larger SPIFFS
; Custom partition table: partitions.csv
; Layout: Factory app + 2x OTA partitions (ota_0 and ota_1) + SPIFFS
; - app0 (ota_0): 1.5MB - First OTA partition
; - app1 (ota_1): 1.5MB - Second OTA partition
; - spiffs: 960KB - File system storage (for web interface and user files)
; This enables over-the-air firmware updates with automatic rollback protection
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; ============================================================
; Environment for ESP32 with 2MB Flash (no rollback OTA)
; ============================================================
[env:jvtech-v3-2mb]
platform = espressif32
board = esp32dev
framework = arduino

; Pre-build script: compress web files
extra_scripts = pre:scripts/compress_web_files.py

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -fpermissive
    -Wno-deprecated-declarations
    ; Async TCP/WebServer optimizations
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    ; Increase web server buffer for large files
    -DWEBSERVER_MAX_CONTENT_SIZE=8192
    ; Increase MQTT buffer for large JSON payloads (increased from 2048 to 4096)
    -DMQTT_MAX_PACKET_SIZE=4096
    ; Compiler optimizations for size (2MB flash is limited)
    -Os
    -ffast-math
    ; Disable OTA rollback protection (saves flash space)
    -DOTA_NO_ROLLBACK
    ; I2C Pins (Custom for 2MB board)
    -DPIN_I2C_SDA=21
    -DPIN_I2C_SCL=22

; Library dependencies
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/dvarrel/AsyncTCP
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10
    arduino-libraries/NTPClient@^3.2.1

; Upload settings
upload_speed = 921600

; Partition scheme for 2MB flash with single OTA (no rollback)
; Custom partition table: partitions_2mb.csv
; Layout: Single OTA partition + SPIFFS
; - app: 1.2MB - Single OTA partition (no rollback)
; - spiffs: 704KB - File system storage (for web interface and user files)
; This enables OTA updates but WITHOUT automatic rollback protection
; Use this for devices with limited flash memory (2MB)
board_build.partitions = partitions_2mb.csv
board_build.filesystem = littlefs

; Flash settings
board_build.flash_mode = dio
board_upload.flash_size = 2MB
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
