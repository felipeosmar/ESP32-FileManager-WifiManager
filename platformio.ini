; PlatformIO Project Configuration File
; ESP32 File Manager with WiFi Manager and OTA Updates

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -fpermissive
    -Wno-deprecated-declarations
    ; Async TCP/WebServer optimizations
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    ; Increase web server buffer for large files
    -DWEBSERVER_MAX_CONTENT_SIZE=8192
    ; Compiler optimizations for performance
    -O2
    -ffast-math

; Library dependencies
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/dvarrel/AsyncTCP
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10

; Upload settings
upload_speed = 921600

; Partition scheme for OTA support with larger SPIFFS
; Custom partition table: partitions.csv
; Layout: Factory app + 2x OTA partitions (ota_0 and ota_1) + SPIFFS
; - app0 (ota_0): 1.5MB - First OTA partition
; - app1 (ota_1): 1.5MB - Second OTA partition
; - spiffs: 960KB - File system storage (for web interface and user files)
; This enables over-the-air firmware updates with automatic rollback protection
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
