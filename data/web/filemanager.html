<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager - ESP32</title>
    <link rel="stylesheet" href="/unified.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
</head>

<body>
    <div class="container">
        <div id="header-placeholder"></div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="refreshFiles()">🔄 Atualizar</button>
            <button class="btn btn-success" onclick="createFolder()">📁 Nova Pasta</button>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">⬆️ Upload</button>
        </div>

        <div class="path">
            Caminho: <strong id="currentPath">/</strong>
        </div>

        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <p>🎯 Arraste arquivos aqui ou clique para selecionar</p>
            <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)">
        </div>

        <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill">0%</div>
        </div>

        <div class="file-list" id="fileList">
            <p style="text-align: center; padding: 40px; color: #6c757d;">Carregando...</p>
        </div>
    </div>

    <!-- Editor Modal -->
    <div id="editorModal" class="modal">
        <div class="modal-content" style="width: 90%; height: 90%; max-width: 1000px;">
            <div class="modal-header">
                <h2 id="editorTitle">✏️ Editar Arquivo</h2>
                <span class="close-btn" onclick="closeEditor()">&times;</span>
            </div>
            <div class="modal-body" style="padding: 0; height: calc(100% - 120px);">
                <div id="fileEditor" style="height: 100%; width: 100%;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditor()">❌ Cancelar</button>
                <button class="btn btn-success" onclick="saveFile()">💾 Salvar</button>
            </div>
        </div>
        <div id="footer-placeholder"></div>
    </div>

    <script src="header.js"></script>
    <script>
        loadHeader('📁 File Manager');
    </script>
    <script src="/filemanager.js"></script>
    <script src="footer.js"></script>
</body>

</html>
